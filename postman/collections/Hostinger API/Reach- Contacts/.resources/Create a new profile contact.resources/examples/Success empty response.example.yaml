$kind: http-example
request:
  url: "{{baseUrl}}/api/reach/v1/profiles/:profileUuid/contacts"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: profileUuid
      value: <string>
      description: (Required) Profile uuid parameter
  body:
    type: json
    content: |-
      {
        "email": "<string>",
        "name": "<string>",
        "surname": "<string>",
        "note": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>"
      }
order: 1000
