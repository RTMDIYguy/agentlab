$kind: http-request
description: |-
  Create a new contact in the email marketing system.

  This endpoint allows you to create a new contact with basic information like name, email, and surname.

  If double opt-in is enabled, the contact will be created with a pending status and a confirmation email will be sent.
url: "{{baseUrl}}/api/reach/v1/contacts"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "<string>",
      "name": "<string>",
      "surname": "<string>",
      "note": "<string>"
    }
settings: {}
examples: ./.resources/Create a new contact.resources/examples
order: 4000
