options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/agentlab/agentlab:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/agentlab/agentlab:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - agentlab
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/agentlab/agentlab:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --quiet