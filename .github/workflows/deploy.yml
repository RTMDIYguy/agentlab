name: Build and Deploy to Artifact Registry

# DISABLED as a push trigger — 2026-10-02, register CC-2026-10-02-005.
#
# Why (evidence):
#   1. It failed on EVERY push at the auth step: `secrets.GCP_SA_KEY` is
#      not defined in this repo, so google-github-actions/auth aborts in
#      ~15s ("must specify exactly one of workload_identity_provider or
#      credentials_json") — it never built and never deployed, just red
#      runs on every commit.
#   2. Its deploy path diverges from production: it pushes to the
#      `workflow-registry` image repo, while every live revision
#      (00205…00209) came from `gcloud run deploy --source .`
#      (cloud-run-source-deploy) — the proven path, per register
#      CC-2026-10-02-004.
#
# Production deploys:
#   gcloud run deploy agentlab --source . --region us-central1
#
# To re-enable: prefer Workload Identity Federation (no stored key) over
# GCP_SA_KEY, reconcile the image repo with the live path, and decide
# deliberately whether pushes should auto-deploy production (today: no).
on:
  workflow_dispatch:

env:
  PROJECT_ID: project-36330a6c-5e91-4901-9dd
  REGION: us-central1
  GAR_LOCATION: us-central1-docker.pkg.dev
  REPOSITORY: workflow-registry
  IMAGE: agentlab

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker Login
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }} --quiet

      - name: Build and Push Container Image
        run: |
          TAG="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"
          docker build -t $TAG .
          docker push $TAG

      - name: Deploy to Cloud Run
        run: |
          TAG="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"
          gcloud run deploy agentlab \
            --image $TAG \
            --region ${{ env.REGION }} \
            --platform managed \
            --quiet

