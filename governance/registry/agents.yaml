    name: "Central Ops Orchestrator"
    purpose: "Primary DAG planning, agent task dispatch, guardrail checking, and error recovery."
    workspace_scope: "per_workspace"
    system_prompt_ref: "server/domain/urc-model.ts"
    knowledge_scope:
      - "system_operating_rules"
      - "installed_knowledge_packages"
    tools:
      - "dispatch_agent"
      - "trigger_workflow"
      - "evaluate_policy"
