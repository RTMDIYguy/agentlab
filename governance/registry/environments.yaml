# Agent Lab Canonical Registry: Environments & Tenancy Workspaces
# Level 1 Authority

environments:
  - id: ENV-LOCAL
    name: "Local Development Environment"
    env_type: local
    purpose: "Developer machines running Vite dev server + local Node/Express backend."
    status: active
    owner: "Robert T. McCarthy"
    access_policy: "Developer only"
    last_verified: "2026-08-28"
    version: "1.0.0"

  - id: ENV-PROD
    name: "Production Cloud Environment"
    env_type: production
    purpose: "Live user-facing multi-tenant SaaS running on Google Cloud Run + PostgreSQL."
    status: active
    owner: "Robert T. McCarthy"
    access_policy: "Authenticated operators & paying tenants"
    last_verified: "2026-08-28"
    version: "1.0.0"

workspaces:
  - id: WS-0000-URC
    name: "URC Master Workspace"
    workspace_type: urc
    organization_id: ORG-URC
    display_name: "Uncle Robert Consulting Command Center"
    status: active
    plan: "internal_unlimited"
    enabled_modules:
      - "all"
    disabled_modules: []
    data_policy:
      retention_days: 365
      pii_redaction: true
      saif_enforcement: true
    owner: "Robert T. McCarthy"
    last_verified: "2026-08-28"
    version: "1.0.0"

  - id: WS-CLIENT-TEMPLATE
    name: "Client Tenant Workspace Template"
    workspace_type: client
    organization_id: ORG-URC
    display_name: "Isolated Client Tenant"
    status: active
    plan: "tier_1_starter"
    enabled_modules:
      - "core_orchestrator"
    disabled_modules:
      - "unpurchased_knowledge_packages"
    data_policy:
      retention_days: 90
      pii_redaction: true
      saif_enforcement: true
    owner: "Robert T. McCarthy / TECH"
    last_verified: "2026-08-28"
    version: "1.0.0"
