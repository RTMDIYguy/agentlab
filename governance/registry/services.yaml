# Agent Lab Canonical Registry: Services & Application Runtime
# Level 1 Authority

services:
  - id: SVC-CLIENT-WEB
    name: "Agent Lab Frontend Web App"
    service_type: client_spa
    runtime: "React 19 / Vite"
    deployment_platform: "Vercel / Cloud Run"
    repository: "RTMDIYguy/agentlab"
    entrypoint: "client/src/main.tsx"
    dependencies:
      - "@tanstack/react-query"
      - "wouter"
      - "radix-ui"
      - "tailwindcss"
    status: active
    owner: "Robert T. McCarthy / TECH"
    last_verified: "2026-08-28"
    version: "1.0.0"

  - id: SVC-SERVER-API
    name: "Agent Lab Express API Server"
    service_type: api_backend
    runtime: "Node.js / TypeScript (tsx/esbuild)"
    deployment_platform: "Google Cloud Run"
    repository: "RTMDIYguy/agentlab"
    entrypoint: "server/_core/index.ts"
    dependencies:
      - "express"
      - "drizzle-orm"
      - "postgres"
      - "@trpc/server"
      - "stripe"
    status: active
    owner: "Robert T. McCarthy / TECH"
    last_verified: "2026-08-28"
    version: "1.0.0"

  - id: SVC-ORCHESTRATOR
    name: "Agent Lab Workflow & Agent Orchestrator"
    service_type: execution_engine
    runtime: "Node.js / Google GenAI SDK"
    deployment_platform: "Google Cloud Run (in-process)"
    repository: "RTMDIYguy/agentlab"
    entrypoint: "server/execution/queue-processor.ts"
    dependencies:
      - "@ai-sdk/google"
      - "ai"
    status: active
    owner: "Robert T. McCarthy / TECH"
    last_verified: "2026-08-28"
    version: "1.0.0"

  - id: SVC-BILLING-ENGINE
    name: "Agent Lab Adaptive Billing & Metering Engine"
    service_type: billing_worker
    runtime: "Node.js / TypeScript"
    deployment_platform: "Google Cloud Run"
    repository: "RTMDIYguy/agentlab"
    entrypoint: "server/execution/billing-engine.ts"
    dependencies:
      - "stripe"
      - "drizzle-orm"
    status: active
    owner: "Robert T. McCarthy / FIN"
    last_verified: "2026-08-28"
    version: "1.0.0"

  - id: SVC-PULSE-SOCIAL
    name: "Pulse Social App"
    service_type: social_syndication_app
    runtime: "Node.js / React"
    deployment_platform: "Render / Cloud Run"
    repository: "Pulse Social"
    entrypoint: "run_pulse_social.bat"
    status: active
    owner: "Robert T. McCarthy / MKT"
    last_verified: "2026-08-29"
    version: "1.0.0"

  - id: SVC-MARKET-MARKSMAN
    name: "Market Marksman (Predictive Business Opportunity App)"
    service_type: opportunity_discovery_app
    runtime: "Python / Web App"
    deployment_platform: "Local / Cloud"
    repository: "Market Marksman"
    status: active
    owner: "Robert T. McCarthy / SAL"
    last_verified: "2026-08-29"
    version: "1.0.0"

  - id: SVC-LEADPULSE
    name: "LeadPulse App"
    service_type: lead_enrichment_app
    runtime: "TypeScript / Node"
    deployment_platform: "Cloud"
    repository: "LeadPulse"
    status: active
    owner: "Robert T. McCarthy / SAL"
    last_verified: "2026-08-29"
    version: "1.0.0"

  - id: SVC-CONSULTING-ASSESSMENT-GEN
    name: "Consulting Assessment Question Generator"
    service_type: internal_diagnostic_tool
    runtime: "TypeScript / Node"
    deployment_platform: "Local / Staged"
    repository: "Consulting Assessment Question Generator"
    status: offline
    owner: "Robert T. McCarthy / OPS"
    last_verified: "2026-08-29"
    version: "0.9.0"

  - id: SVC-48HR-LINKEDIN-AUTHORITY
    name: "48-Hour LinkedIn Authority System"
    service_type: legacy_campaign_system
    runtime: "Document / Workflow"
    deployment_platform: "Offline"
    repository: "48-Hour LinkedIn Authority System"
    status: offline
    owner: "Robert T. McCarthy / MKT"
    last_verified: "2026-08-29"
    version: "0.5.0"

